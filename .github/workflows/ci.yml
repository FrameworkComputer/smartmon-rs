name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lints:
    name: Lints
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Setup Rust toolchain
      run: rustup show

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy --all-targets -- -D warnings

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Setup Rust toolchain
      run: rustup show

    - name: Build
      run: cargo build --all-targets

    - name: Run tests
      run: cargo test

    # Without root no disks can be opened, but it makes sure everything links
    # and the library initializes
    - name: Run example
      run: cargo run --example lsdisk

    # Makes sure the published crate builds with only the files in 'include'
    - name: Package
      run: cargo package

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Setup Rust toolchain
      run: |
        MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
        rustup toolchain install "$MSRV" --profile minimal
        rustup override set "$MSRV"

    - name: Build
      run: cargo build --all-targets

  build-windows:
    name: Build Windows (MSVC)
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Setup Rust toolchain
      run: rustup show

    - name: Build
      run: cargo build --all-targets

    - name: Run example
      run: cargo run --example lsdisk

  build-windows-gnu:
    name: Build Windows (MinGW cross)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-mingw-w64-x86-64

    - name: Setup Rust toolchain
      run: |
        rustup show
        rustup target add x86_64-pc-windows-gnu

    - name: Build
      run: cargo build --all-targets --target x86_64-pc-windows-gnu

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Setup Rust toolchain
      run: rustup show

    - name: Build
      run: cargo build --all-targets

    - name: Run example
      run: cargo run --example lsdisk

  build-freebsd:
    name: Build FreeBSD
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Build
      uses: vmactions/freebsd-vm@v1
      with:
        release: "15.0"
        arch: x86_64
        usesh: true
        mem: 8192
        sync: rsync
        prepare: |
          pkg install -y rust
        run: |
          cargo build --all-targets
          cargo run --example lsdisk
