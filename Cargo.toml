[package]
name = "smartmon"
version = "0.1.0"
description = "Rust bindings for libsmartmon (smartmontools built as a library)"
license = "GPL-2.0-or-later"
repository = "https://github.com/FrameworkComputer/smartmon-rs"
readme = "README.md"
keywords = ["smartmontools", "smart", "nvme", "ata", "disk"]
categories = ["external-ffi-bindings", "hardware-support", "os"]
edition = "2021"
rust-version = "1.81"
links = "smartmon"
include = [
    "/build.rs",
    "/src",
    "/examples",
    "/README.md",
    "/smartmontools/COPYING",
    "/smartmontools/configure.ac",
    "/smartmontools/drivedb/drivedb.h",
    "/smartmontools/include",
    "/smartmontools/lib",
]

[build-dependencies]
cc = "1"

# The C++ sources can't be cross-compiled on docs.rs, the API is the same everywhere
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
